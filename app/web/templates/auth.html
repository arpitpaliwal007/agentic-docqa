<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocQA · {{ "Sign in" if mode == "login" else "Create account" }}</title>{% include "_style.html" %}
<style>.card{max-width:360px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.6rem;display:grid;gap:.8rem}</style>
</head><body>
<form class="card" method="post" action="/{{ mode }}">
  <h2 style="margin:0">{{ "Sign in" if mode == "login" else "Create account" }}</h2>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <label>Username<input name="username" autocomplete="username" required></label>
  <label>Password<input name="password" type="password" autocomplete="{{ 'current-password' if mode == 'login' else 'new-password' }}" required></label>
  <button class="primary">{{ "Sign in" if mode == "login" else "Create account" }}</button>
  {% if mode == "login" %}<span class="muted">No account? <a href="/register">Create one</a></span>
  {% else %}<span class="muted">Have an account? <a href="/login">Sign in</a></span>{% endif %}
</form></body></html>
